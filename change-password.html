        <div class="wrapper" id ="changePasswordWrapper">

            <div class="password-form" id="changePasswordForm">
                 <form id="changeForm">
    <h2>Change Password</h2>
    <p class="hint">You must set a new password before continuing.</p>

    <label for="currentPassword">Current password</label>
    <input id="currentPassword" type="password" autocomplete="current-password" required />

    <label for="newPassword">New password</label>
    <input id="newPassword" type="password" autocomplete="new-password" minlength="6" required />

    <label for="confirmPassword">Confirm new password</label>
    <input id="confirmPassword" type="password" autocomplete="new-password" required />

    <button type="submit" id="submitBtn">Update Password</button>
    <div id="message"></div>
  </form>
            </div>
        </div>

                <div id="loader">
            <div class="spinner-border text-light" role="status">
            </div>
        </div>

        <script src="js/change-password.js"></script>
        <script src="js/bootstrap.bundle.js"></script>
        <script>

        const loader = document.getElementById("loader");

        loader.style.transition = "opacity 1.75s";
        loader.style.opacity = "opacity 0"

        setTimeout(() => {
            loader.style.display = "none";
            document.getElementById("changePasswordForm").style.display = "block";
        }, 550)



    </script>
