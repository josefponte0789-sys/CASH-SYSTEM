<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/loader.css">
    <link rel="stylesheet" href="css/bootstrap.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">CRES</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="index.html">Encode Data</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="clientlist.html">Client List</a>
                    </li>


                </ul>
            </div>
        </div>
    </nav>
    <div id="loader">
        <div class="spinner-border text-light" role="status">
        </div>
    </div>


    <div class="wrapper">
        <form id="userForm">
            <div class="group-input">

                <video id="userWebcam" class="video-capture-screen" autoplay playsinline></video>
                <button type="button" id="startCamera" class="btn btn-outline-secondary">Start Camera</button>
                <div class="form-floating">
                    <input type="text" class="form-control" id="clientName" placeholder="Ex. Juan Dela Cruz">
                    <label for="floatingInput">Name of Client</label>
                </div>
                <div class="form-floating">
                    <input type="number" class="form-control" id="codeName" placeholder="Ex. 1234567">
                    <label for=" floatingPassword">Code</label>
                </div>
                <div class="form-floating">
                    <input type="date" class="form-control" id="dateTime" placeholder="MM/DD/YYYY">
                    <label for="floatingPassword">Date</label>
                </div>
                <button type="submit" class="btn btn-outline-primary">Save Data</button>


            </div>
        </form>
    </div>

</body>

<script src="js/index.js"></script>
<script src="js/loader.js"></script>
<script src="js/bootstrap.bundle.js"></script>


</html>
