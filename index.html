<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/loader.css">
    <link rel="stylesheet" href="css/bootstrap.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">CASH</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link " aria-current="page" href="index.html">Encode Data</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="clientlist.html">Client List</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="datamanagement.html">Data Management</a>
                    </li>


                </ul>
            </div>
        </div>
    </nav>
    <div id="loader">
        <div class="spinner-border text-light" role="status">
        </div>
    </div>


    <div class="wrapper">
        <form id="userForm">
            <div class="group-input">
                <h1>Client Information</h1>
                <div class="video-container">
                    <video id="userWebcam" class="video-capture-screen" autoplay playsinline></video>
                    <div id="videoDate" class="video-date"></div>
                </div>
                <button type="button" id="startCamera" class="btn btn-outline-secondary">Start Camera</button>
                <div class="form-floating">
                    <input type="text" class="form-control" id="clientName" placeholder="Ex. Juan Dela Cruz">
                    <label for="floatingInput">Name of Client</label>
                </div>
                <div class="form-floating">
                    <input type="text" class="form-control" id="authorizedPersonnel" placeholder="Ex. Juan Dela Cruz">
                    <label for="floatingInput" name="authorizedPersonnel">Authorized Personnel (Optional)</label>
                </div>
                <div class="small-container">
                    <div class="form-floating">
                        <input type="number" class="form-control" id="codeName" placeholder="Ex. 1234567">
                        <label for=" floatingPassword">Bank No.</label>
                    </div>
                    <div class="form-floating">
                        <input type="text" class="form-control" id="dateTime" placeholder="MM/DD/YYYY">
                        <label for="floatingPassword">Date</label>
                    </div>
                </div>
                <button type="submit" class="btn btn-outline-primary" onclick="return confirm ('Save this user data?')"
                    id="saveDataButton">Save Data</button>


            </div>
        </form>
    </div>

</body>

<script src="js/index.js"></script>
<script src="js/loader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script>
    flatpickr("#dateTime", {
        enableTime: true,
        dateFormat: "m-d-Y h:i K",
    });
</script>
<script src="js/bootstrap.bundle.js"></script>


</html>
