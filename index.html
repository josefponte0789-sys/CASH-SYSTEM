<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/bootstrap.css">
</head>

<body>
    <div class="wrapper">

        <div class="group-input">
            <form id="userForm">
                <video src=""></video>
                <button type="button" class="btn btn-outline-light">Capture</button>
                <div class="form-floating">
                    <input type="text" class="form-control" id="clientName" placeholder="Ex. Juan Dela Cruz">
                    <label for="floatingInput">Name of Client</label>
                </div>
                <div class="form-floating">
                    <input type="text" class="form-control" id="codeNumber" placeholder="Ex. 1234567">
                    <label for=" floatingPassword">Code</label>
                </div>
                <div class="form-floating">
                    <input type="date" class="form-control" id="dateTime" placeholder="MM/DD/YYYY">
                    <label for="floatingPassword">Date</label>
                </div>
                <button type="submit" class="btn btn-outline-primary">Save Data</button>

            </form>
        </div>
    </div>

</body>

<script src="js/bootstrap.bundle.js"></script>
<script src="js/index.js"></script>

</html>
