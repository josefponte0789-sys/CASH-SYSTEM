<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/bootstrap.css">
    <link href="css/datatables.css" rel="stylesheet">
    <link rel="stylesheet" href="css/loader.css">
    <link rel="stylesheet" href="css/clientlist.css">
    <title>List of Clients</title>
</head>

<body>

    <div id="loader">
        <div class="spinner-border text-light" role="status">
        </div>
    </div>

    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">CASH</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link " aria-current="page" href="index.html">Encode Data</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="clientlist.html">Client List</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="datamanagement.html">Data Management</a>
                    </li>


                </ul>
            </div>
        </div>
    </nav>

    <div id="tableWrapper">
        <div class="wrapper" id="tableContainer">
            <div class="table-container">
                <table id="myTable" class="myTable hover">
                    <thead>
                        <tr>
                            <th>Date Taken</th>
                            <th>Client Name</th>
                            <th>Code</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="tableDataOutput">

                    </tbody>

                </table>
            </div>
        </div>
    </div>




    <script src="js/datatables.js"></script>
    <script>

        const loader = document.getElementById("loader");

        loader.style.transition = "opacity 1.75s";
        loader.style.opacity = "opacity 0"

        setTimeout(() => {
            loader.style.display = "none";
            document.getElementById("tableWrapper").style.display = "block";
        }, 550)



    </script>
    <script src="js/bootstrap.bundle.js"></script>
    <script src="js/clientlist.js"></script>

</body>

</html>
