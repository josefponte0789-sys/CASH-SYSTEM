<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/bootstrap.css">
    <link rel="stylesheet" href="css/edit-client.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

</head>

<body>

    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">CASH</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link " aria-current="page" href="index.html">Encode Data</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="clientlist.html">Client
                            List</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="datamanagement.html">Data Management</a>
                    </li>

                </ul>
            </div>
        </div>
    </nav>
    <div class="wrapper">
        <form id="editForm">
            <div class="group-input">
                <h1>Edit Client Data</h1>
                <div class="video-container">
                    <video id="userWebcam" class="video-capture-screen" autoplay playsinline
                        style="display:none;"></video>
                    <div id="videoDate" class="video-date"></div>
                    <img id="clientPhoto" src="" alt="Client photo" class="client-photo">
                </div>
                <button type="button" id="startCamera" class="btn btn-outline-secondary retake-photo">Retake
                    Photo</button>
                <div class="form-floating">
                    <input type="text" class="form-control" id="clientName" placeholder="Ex. Juan Dela Cruz">
                    <label for="clientName" name="clientName">Name of
                        Client</label>
                </div>
                <div class="form-floating">
                    <input type="text" class="form-control" id="authorizedPersonnel" placeholder="Ex. Juan Dela Cruz">
                    <label for="floatingInput" name="authorizedPersonnel">Authorized Personnel (Optional)</label>
                </div>
                <div class="form-floating">
                    <input type="number" class="form-control" id="codeName" placeholder="Ex. 1234567">
                    <label for=" floatingPassword" name="codeName">Check No.</label>
                </div>
                <div class="form-floating">
                    <input type="text" class="form-control" id="dateOfCheck" placeholder="MM/DD/YYYY">
                    <label for="floatingPassword">Date of Check</label>
                </div>
                <div class="form-floating">
                    <input type="text" class="form-control" id="dateTime" placeholder="MM/DD/YYYY">
                    <label for="floatingPassword">Date</label>
                </div>
                <div class="save-button">
                    <button type="submit" class="btn btn-outline-primary" id="saveDataButton"
                        onclick="return confirm ('Save this user data?')">Save Data</button>
                </div>

            </div>
        </form>
    </div>




    <!-- Confirm modal -->
    <div class="modal fade" id="confirmModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header" id="modalHeader">
                    <h1 class="modal-title fs-5" id="confirmModalTitle"></h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="messageStatus">
                    ...
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>

                </div>
            </div>
        </div>
    </div>


    <!-- deleting modal -->
    <div class="modal fade" id="deleteEntryModal" tabindex="-1" aria-labelledby="deleteEntryModalLabel"
        aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-dark" id="deleteModalHeader">
                    <h1 class="modal-title fs-5" id="deleteEntryModalTitle"></h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="deleteEntryMessage">

                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-danger" id="confirmDeleteButton">Confirm</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/bootstrap.bundle.js"></script>
    <script src="js/edit-client.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script>
        flatpickr("#dateTime", {
            enableTime: true,
            dateFormat: "m-d-Y h:i K",
        });

        flatpickr("#dateOfCheck", {
            enableTime: true,
            dateFormat: "m-d-Y h:i K",
        });
    </script>

</body>

</html>
